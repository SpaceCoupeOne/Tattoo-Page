  <section class="reflections-hero">
    <video id="reflections-video" autoplay muted loop playsinline poster="Photos/Mirror-1.jpg">
      <source src="Videos/reflections.mp4" type="video/mp4">
    </video>
    <div class="reflections-overlay">
      <h2>Reflections</h2>
      <p>A short film on the work, in motion.</p>
      <button id="sound-toggle" class="sound-btn" aria-label="Turn sound on">
        <span class="sound-icon">🔇</span> Sound
      </button>
    </div>
  </section>

  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var video = document.getElementById('reflections-video');
      var toggle = document.getElementById('sound-toggle');
      var icon = toggle.querySelector('.sound-icon');

      var prefersReducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (prefersReducedMotion) {
        video.removeAttribute('autoplay');
        video.pause();
        video.currentTime = 0;
      }

      toggle.addEventListener('click', function () {
        video.muted = !video.muted;
        icon.textContent = video.muted ? '🔇' : '🔊';
        toggle.setAttribute('aria-label', video.muted ? 'Turn sound on' : 'Turn sound off');
      });
    });
  </script>

</body>
