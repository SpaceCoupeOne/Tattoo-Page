  <h2>Falling Sand</h2>
  <p><a href="games.html">&larr; Back to Games</a></p>
  <p>Pick a color, then click or drag on the canvas to pour sand.</p>

  <div class="sand-wrap">

    <div class="sand-controls">
      <div class="palette">
        <button class="swatch active" data-color="#161616" style="background:#161616" aria-label="Black"></button>
        <button class="swatch" data-color="#ef233c" style="background:#ef233c" aria-label="Red"></button>
        <button class="swatch" data-color="#fb8500" style="background:#fb8500" aria-label="Orange"></button>
        <button class="swatch" data-color="#ffd60a" style="background:#ffd60a" aria-label="Yellow"></button>
        <button class="swatch" data-color="#06d6a0" style="background:#06d6a0" aria-label="Green"></button>
        <button class="swatch" data-color="#118ab2" style="background:#118ab2" aria-label="Blue"></button>
        <button class="swatch" data-color="#8338ec" style="background:#8338ec" aria-label="Purple"></button>
        <button class="swatch" data-color="#ff5da2" style="background:#ff5da2" aria-label="Pink"></button>
      </div>
      <button id="sand-clear" class="btn">Clear</button>
    </div>

    <div class="sand-canvas-wrap">
      <canvas id="sand-canvas" width="120" height="120"></canvas>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var GRID = 120;
      var canvas = document.getElementById('sand-canvas');
      var ctx = canvas.getContext('2d');
      var cellSize = canvas.width / GRID;
      var grid = new Uint8Array(GRID * GRID);
      var palette = ['#161616', '#ef233c', '#fb8500', '#ffd60a', '#06d6a0', '#118ab2', '#8338ec', '#ff5da2'];
      var currentColor = 1;
      var pointerDown = false;
      var pointerPos = null;

      canvas.style.touchAction = 'none';

      function index(x, y) {
        return y * GRID + x;
      }

      function getGridPos(e) {
        var rect = canvas.getBoundingClientRect();
        var clientX = e.clientX;
        var clientY = e.clientY;
        var x = Math.floor((clientX - rect.left) / rect.width * GRID);
        var y = Math.floor((clientY - rect.top) / rect.height * GRID);
        return { x: x, y: y };
      }

      function spawnAt(gx, gy) {
        for (var i = 0; i < 4; i++) {
          var ox = gx + Math.floor(Math.random() * 5) - 2;
          var oy = gy + Math.floor(Math.random() * 3) - 1;
          if (ox >= 0 && ox < GRID && oy >= 0 && oy < GRID) {
            var idx = index(ox, oy);
            if (grid[idx] === 0) grid[idx] = currentColor;
          }
        }
      }

      function step() {
        for (var y = GRID - 2; y >= 0; y--) {
          for (var x = 0; x < GRID; x++) {
            var idx = index(x, y);
            var val = grid[idx];
            if (val === 0) continue;

            var belowIdx = index(x, y + 1);
            if (grid[belowIdx] === 0) {
              grid[belowIdx] = val;
              grid[idx] = 0;
              continue;
            }

            var dir = Math.random() < 0.5 ? -1 : 1;
            var sideX1 = x + dir;
            var sideX2 = x - dir;

            if (sideX1 >= 0 && sideX1 < GRID && grid[index(sideX1, y + 1)] === 0) {
              grid[index(sideX1, y + 1)] = val;
              grid[idx] = 0;
            } else if (sideX2 >= 0 && sideX2 < GRID && grid[index(sideX2, y + 1)] === 0) {
              grid[index(sideX2, y + 1)] = val;
              grid[idx] = 0;
            }
          }
        }
      }

      function render() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (var y = 0; y < GRID; y++) {
          for (var x = 0; x < GRID; x++) {
            var val = grid[index(x, y)];
            if (val === 0) continue;
            ctx.fillStyle = palette[val - 1];
            ctx.fillRect(x * cellSize, y * cellSize, cellSize, cellSize);
          }
        }
      }

      function loop() {
        step();
        if (pointerDown && pointerPos) spawnAt(pointerPos.x, pointerPos.y);
        render();
        requestAnimationFrame(loop);
      }

      canvas.addEventListener('pointerdown', function (e) {
        pointerDown = true;
        pointerPos = getGridPos(e);
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', function (e) {
        if (pointerDown) pointerPos = getGridPos(e);
      });

      canvas.addEventListener('pointerup', function () {
        pointerDown = false;
      });

      canvas.addEventListener('pointerleave', function () {
        pointerDown = false;
      });

      document.querySelectorAll('.swatch').forEach(function (swatch, i) {
        swatch.addEventListener('click', function () {
          currentColor = i + 1;
          document.querySelectorAll('.swatch').forEach(function (s) {
            s.classList.remove('active');
          });
          swatch.classList.add('active');
        });
      });

      document.getElementById('sand-clear').addEventListener('click', function () {
        grid.fill(0);
      });

      loop();
    });
  </script>

</body>
