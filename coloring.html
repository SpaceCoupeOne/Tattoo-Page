  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var DESIGNS = [
        { id: 'dragon', name: 'Dragon', file: 'dragon.png' },
        { id: 'koi', name: 'Koi', file: 'koi.png' },
        { id: 'roses', name: 'Roses', file: 'roses.png' },
        { id: 'dagger-roses', name: 'Dagger & Roses', file: 'dagger-roses.png' },
        { id: 'panther', name: 'Panther', file: 'panther.png' },
        { id: 'stained-glass-window', name: 'Stained Glass Window', file: 'stained-glass-window.png' }
      ];

      var DARK_THRESHOLD = 140;   // luminance below this = a stroke, not a fillable region
      var MAX_UNDO = 20;
      // A single fill covering more than this % of the canvas is treated as a
      // leak (fill escaped through a gap in the linework) and discarded.
      // 0.4 was too tight: several designs have a wide-open background that's
      // legitimately one connected region well past 40% (Panther's is 63%,
      // Dagger & Roses' is 58%) - those clicks were being silently rejected
      // as false-positive leaks. 0.75 still catches a real leak, which merges
      // the subject and background into one near-total-canvas blob.
      var MAX_FILL_FRACTION = 0.75;

      var canvas = document.getElementById('coloring-canvas');
      var ctx = canvas.getContext('2d', { willReadFrequently: true });
      var pickerEl = document.getElementById('coloring-picker');
      var resetBtn = document.getElementById('reset-coloring');
      var undoBtn = document.getElementById('undo-coloring');

      var currentColor = [240, 192, 0]; // matches the default-active gold swatch
      var undoStack = [];
      var currentImage = null;
      var currentStrokeMask = null;

      function hexToRgb(hex) {
        hex = hex.replace('#', '');
        return [
          parseInt(hex.substring(0, 2), 16),
          parseInt(hex.substring(2, 4), 16),
          parseInt(hex.substring(4, 6), 16)
        ];
      }

      // Canvas loads go through fm=png (not the site's usual webp) and skip the
      // width param entirely: these PNGs are already pure black/white with no
      // anti-aliasing, and the flood fill below depends on that staying true.
      // Lossy webp re-encoding or a CDN resize would reintroduce the soft grey
      // edge pixels the prep pipeline was built to remove, giving the fill
      // gaps to leak through. Thumbnails never get flood-filled, so they use
      // the same webp+width treatment as every other image on the site.
      function cdnUrl(file, opts) {
        var url = '/.netlify/images?url=/Coloring/' + file;
        if (opts && opts.w) url += '&w=' + opts.w;
        url += '&fm=' + ((opts && opts.fm) || 'png');
        return url;
      }

      function updateUndoState() {
        undoBtn.disabled = undoStack.length === 0;
      }

      function loadDesign(design) {
        var img = new Image();
        img.onload = function () {
          canvas.width = img.naturalWidth;
          canvas.height = img.naturalHeight;
          ctx.drawImage(img, 0, 0);
          canvas.setAttribute('aria-label', design.name + ' coloring page');
          currentImage = img;
          currentStrokeMask = buildStrokeMask(ctx.getImageData(0, 0, canvas.width, canvas.height));
          undoStack = [];
          updateUndoState();
        };
        img.src = cdnUrl(design.file, { fm: 'png' });
      }

      function resetCanvas() {
        if (!currentImage) return;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.drawImage(currentImage, 0, 0);
        undoStack = [];
        updateUndoState();
      }

      function luminance(r, g, b) {
        return 0.299 * r + 0.587 * g + 0.114 * b;
      }

      // Captured once per loaded design, from the pristine pixels before any
      // fill happens - 1 where a pixel is stroke/ink, 0 where it's fillable.
      // Boundaries are checked against this static mask, never against the
      // live (possibly already-filled) canvas: several palette colors
      // (black, brown, red, coral, teal, cyan, purple) are themselves darker
      // than DARK_THRESHOLD, so checking live pixel color would make a region
      // permanently un-refillable the moment it's filled with one of those -
      // a click to change its color would read as "clicked a stroke" and
      // silently do nothing.
      function buildStrokeMask(imageData) {
        var width = imageData.width;
        var height = imageData.height;
        var data = imageData.data;
        var mask = new Uint8Array(width * height);
        for (var i = 0, p = 0; i < mask.length; i++, p += 4) {
          mask[i] = luminance(data[p], data[p + 1], data[p + 2]) < DARK_THRESHOLD ? 1 : 0;
        }
        return mask;
      }

      // Boundary fill, not classic same-color fill: it spreads through any
      // non-stroke pixel regardless of its current color and stops only at
      // the stroke mask. That lets a click recolor a region that's already
      // been filled once, the same way a real coloring book works.
      function floodFill(imageData, strokeMask, startX, startY, fillRGB, maxAllowed) {
        var width = imageData.width;
        var height = imageData.height;
        var data = imageData.data;
        var startPixel = startY * width + startX;

        if (strokeMask[startPixel]) return 0;

        var visited = new Uint8Array(width * height);
        var stack = [startPixel];
        visited[startPixel] = 1;
        var count = 0;

        while (stack.length) {
          var idx = stack.pop();
          var x = idx % width;
          var y = (idx / width) | 0;
          var pIdx = idx * 4;

          data[pIdx] = fillRGB[0];
          data[pIdx + 1] = fillRGB[1];
          data[pIdx + 2] = fillRGB[2];
          data[pIdx + 3] = 255;
          count++;

          if (count > maxAllowed) return count;

          tryPush(x - 1, y);
          tryPush(x + 1, y);
          tryPush(x, y - 1);
          tryPush(x, y + 1);
        }

        return count;

        function tryPush(nx, ny) {
          if (nx < 0 || nx >= width || ny < 0 || ny >= height) return;
          var nIdx = ny * width + nx;
          if (visited[nIdx] || strokeMask[nIdx]) return;
          visited[nIdx] = 1;
          stack.push(nIdx);
        }
      }

      function getCanvasPoint(e) {
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        var x = Math.floor((e.clientX - rect.left) * scaleX);
        var y = Math.floor((e.clientY - rect.top) * scaleY);
        x = Math.max(0, Math.min(canvas.width - 1, x));
        y = Math.max(0, Math.min(canvas.height - 1, y));
        return { x: x, y: y };
      }

      function handleFillClick(e) {
        if (!currentImage || !currentStrokeMask) return;
        var pt = getCanvasPoint(e);
        var imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        var before = new ImageData(new Uint8ClampedArray(imageData.data), imageData.width, imageData.height);
        var maxAllowed = Math.floor(canvas.width * canvas.height * MAX_FILL_FRACTION);

        var filledCount = floodFill(imageData, currentStrokeMask, pt.x, pt.y, currentColor, maxAllowed);

        if (filledCount === 0) return;          // clicked a stroke, nothing to fill
        if (filledCount > maxAllowed) return;    // leak guard: discard, canvas untouched

        undoStack.push(before);
        if (undoStack.length > MAX_UNDO) undoStack.shift();
        ctx.putImageData(imageData, 0, 0);
        updateUndoState();
      }

      function handleUndo() {
        if (!undoStack.length) return;
        var prev = undoStack.pop();
        ctx.putImageData(prev, 0, 0);
        updateUndoState();
      }

      canvas.addEventListener('click', handleFillClick);
      resetBtn.addEventListener('click', resetCanvas);
      undoBtn.addEventListener('click', handleUndo);

      document.querySelectorAll('.palette .swatch').forEach(function (swatch) {
        swatch.addEventListener('click', function () {
          currentColor = hexToRgb(swatch.dataset.color);
          document.querySelectorAll('.palette .swatch').forEach(function (s) {
            s.classList.remove('active');
          });
          swatch.classList.add('active');
        });
      });

      DESIGNS.forEach(function (design, i) {
        var thumb = document.createElement('button');
        thumb.type = 'button';
        thumb.className = 'design-thumb';
        thumb.setAttribute('aria-label', design.name);
        thumb.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
        if (i === 0) thumb.classList.add('active');

        var img = document.createElement('img');
        img.src = cdnUrl(design.file, { w: 140, fm: 'webp' });
        img.alt = '';
        thumb.appendChild(img);

        thumb.addEventListener('click', function () {
          document.querySelectorAll('.design-thumb').forEach(function (t) {
            t.classList.remove('active');
            t.setAttribute('aria-pressed', 'false');
          });
          thumb.classList.add('active');
          thumb.setAttribute('aria-pressed', 'true');
          loadDesign(design);
        });

        pickerEl.appendChild(thumb);
      });

      loadDesign(DESIGNS[0]);
    });
  </script>
