<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>calendar test</title>
<link rel="stylesheet" href="style.css">
<style>#results{background:#fff;color:#000;font:13px monospace;padding:1rem;white-space:pre-wrap;position:relative;z-index:10;}</style>
</head>
<body>

<section id="availability" aria-labelledby="availability-heading">
  <h2 id="availability-heading">Current availability</h2>
  <p>Highlighted days are open. Send a request below and we'll find a
  date that works.</p>
  <div id="availability-calendar" hidden></div>
</section>

<pre id="results"></pre>

<script src="calendar.js"></script>
<script>
  function log(msg) { document.getElementById('results').textContent += msg + '\n'; }

  window.addEventListener('load', function () {
    setTimeout(function () {
      var openCount = document.querySelectorAll('.day-open').length;
      var bookedCount = document.querySelectorAll('.day-booked').length;
      var pastCount = document.querySelectorAll('.day-past').length;
      var closedCount = document.querySelectorAll('.day-closed').length;
      log('day-open: ' + openCount + ', day-booked: ' + bookedCount + ', day-past: ' + pastCount + ', day-closed: ' + closedCount);

      // Every open cell should NOT fall on Sunday/Monday. Reconstruct
      // each open cell's actual date by walking the DOM structure.
      var wrongOpenDays = [];
      var wrongClosedDays = [];
      document.querySelectorAll('.calendar-month').forEach(function (monthEl) {
        var titleText = monthEl.querySelector('.calendar-month-title').textContent; // "August 2026"
        var parts = titleText.split(' ');
        var monthNames = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        var monthIdx = monthNames.indexOf(parts[0]);
        var year = parseInt(parts[1], 10);

        monthEl.querySelectorAll('.day-open').forEach(function (cell) {
          var day = parseInt(cell.textContent, 10);
          var dow = new Date(year, monthIdx, day).getDay();
          if (dow === 0 || dow === 1) wrongOpenDays.push(parts[0] + ' ' + day + ' (dow ' + dow + ')');
        });

        monthEl.querySelectorAll('.day-closed').forEach(function (cell) {
          var day = parseInt(cell.textContent, 10);
          var dow = new Date(year, monthIdx, day).getDay();
          if (dow !== 0 && dow !== 1) wrongClosedDays.push(parts[0] + ' ' + day + ' (dow ' + dow + ')');
          if (!cell.hasAttribute('aria-label')) wrongClosedDays.push(parts[0] + ' ' + day + ' MISSING aria-label');
        });
      });
      log('open cells that are actually Sun/Mon (should be 0): ' + wrongOpenDays.length + (wrongOpenDays.length ? ' -> ' + wrongOpenDays.join(', ') : ''));
      log('closed cells that are wrong (should be 0): ' + wrongClosedDays.length + (wrongClosedDays.length ? ' -> ' + wrongClosedDays.join(', ') : ''));

      // Sample a few aria-labels
      var sample = [];
      document.querySelectorAll('.day-closed').forEach(function (c, i) { if (i < 5) sample.push(c.getAttribute('aria-label')); });
      log('sample closed aria-labels: ' + sample.join(' | '));
    }, 300);
  });
</script>
</body>
</html>
