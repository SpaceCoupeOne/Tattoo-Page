  <h2>Chess</h2>
  <p><a href="games.html">&larr; Back to Games</a></p>
  <p>Two-player, same screen — take turns making moves.</p>

  <div class="chess-wrap">
    <div id="chess-board" class="chess-board"></div>
    <div class="chess-side">
      <p id="chess-status">White to move.</p>
      <button id="chess-new" class="btn">New Game</button>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
  <script src="https://unpkg.com/@chrisoakman/chessboardjs@1.0.0/dist/chessboard-1.0.0.min.js"></script>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var game = new Chess();
      var statusEl = document.getElementById('chess-status');

      function onDragStart(source, piece) {
        if (game.game_over()) return false;
        if ((game.turn() === 'w' && piece.search(/^b/) !== -1) ||
            (game.turn() === 'b' && piece.search(/^w/) !== -1)) {
          return false;
        }
      }

      function onDrop(source, target) {
        var move = game.move({ from: source, to: target, promotion: 'q' });
        if (move === null) return 'snapback';
        updateStatus();
      }

      function onSnapEnd() {
        board.position(game.fen());
      }

      function updateStatus() {
        var turn = game.turn() === 'w' ? 'White' : 'Black';
        var text = turn + ' to move.';

        if (game.in_checkmate()) {
          text = turn + ' is in checkmate. ' + (turn === 'White' ? 'Black' : 'White') + ' wins!';
        } else if (game.in_draw()) {
          text = 'Draw.';
        } else if (game.in_check()) {
          text = turn + ' is in check.';
        }

        statusEl.textContent = text;
      }

      var board = Chessboard('chess-board', {
        draggable: true,
        position: 'start',
        pieceTheme: 'https://chessboardjs.com/img/chesspieces/wikipedia/{piece}.png',
        onDragStart: onDragStart,
        onDrop: onDrop,
        onSnapEnd: onSnapEnd
      });

      document.getElementById('chess-new').addEventListener('click', function () {
        game.reset();
        board.position('start');
        updateStatus();
      });

      document.getElementById('chess-undo').addEventListener('click', function () {
        game.undo();
        board.position(game.fen());
        updateStatus();
      });
    });
  </script>
