  <h2>Mandala Maker</h2>
  <p><a href="games.html">&larr; Back to Games</a></p>
  <p>Draw anywhere on the circle. Every stroke is mirrored around the center.</p>

  <div class="mandala-wrap">

    <div class="mandala-controls">
      <div class="palette">
        <button class="swatch active" data-color="#161616" style="background:#161616" aria-label="Black"></button>
        <button class="swatch" data-color="#ef233c" style="background:#ef233c" aria-label="Red"></button>
        <button class="swatch" data-color="#fb8500" style="background:#fb8500" aria-label="Orange"></button>
        <button class="swatch" data-color="#ffd60a" style="background:#ffd60a" aria-label="Yellow"></button>
        <button class="swatch" data-color="#06d6a0" style="background:#06d6a0" aria-label="Green"></button>
        <button class="swatch" data-color="#118ab2" style="background:#118ab2" aria-label="Blue"></button>
        <button class="swatch" data-color="#8338ec" style="background:#8338ec" aria-label="Purple"></button>
        <button class="swatch" data-color="#ff5da2" style="background:#ff5da2" aria-label="Pink"></button>
      </div>

      <div class="mandala-symmetry">
        <button type="button" class="filter-btn" data-symmetry="4">4</button>
        <button type="button" class="filter-btn" data-symmetry="6">6</button>
        <button type="button" class="filter-btn active" data-symmetry="8">8</button>
        <button type="button" class="filter-btn" data-symmetry="12">12</button>
      </div>

      <button id="mandala-clear" class="btn">Clear</button>
    </div>

    <div class="mandala-canvas-wrap">
      <canvas id="mandala-canvas" width="440" height="440"></canvas>
    </div>

  </div>

  <script>
    document.addEventListener('DOMContentLoaded', function () {
      var canvas = document.getElementById('mandala-canvas');
      var ctx = canvas.getContext('2d');
      var cx = canvas.width / 2;
      var cy = canvas.height / 2;
      var symmetry = 8;
      var currentColor = '#161616';
      var isDrawing = false;
      var lastPos = null;

      canvas.style.touchAction = 'none';

      function drawGuide() {
        ctx.save();
        ctx.strokeStyle = '#cccccc';
        ctx.lineWidth = 1;
        ctx.setLineDash([6, 6]);
        ctx.beginPath();
        ctx.arc(cx, cy, cx - 10, 0, Math.PI * 2);
        ctx.stroke();
        ctx.restore();
      }

      function clearCanvas() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        drawGuide();
      }

      function getPos(e) {
        var rect = canvas.getBoundingClientRect();
        var scaleX = canvas.width / rect.width;
        var scaleY = canvas.height / rect.height;
        return {
          x: (e.clientX - rect.left) * scaleX,
          y: (e.clientY - rect.top) * scaleY
        };
      }

      function transformPoint(dx, dy, cosA, sinA) {
        return {
          x: cx + dx * cosA - dy * sinA,
          y: cy + dx * sinA + dy * cosA
        };
      }

      function strokeLine(p1, p2) {
        ctx.beginPath();
        ctx.moveTo(p1.x, p1.y);
        ctx.lineTo(p2.x, p2.y);
        ctx.stroke();
      }

      function drawSegment(x1, y1, x2, y2) {
        var dx1 = x1 - cx, dy1 = y1 - cy;
        var dx2 = x2 - cx, dy2 = y2 - cy;

        ctx.strokeStyle = currentColor;
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';

        for (var k = 0; k < symmetry; k++) {
          var angle = k * (2 * Math.PI / symmetry);
          var cosA = Math.cos(angle);
          var sinA = Math.sin(angle);

          strokeLine(
            transformPoint(dx1, dy1, cosA, sinA),
            transformPoint(dx2, dy2, cosA, sinA)
          );
          strokeLine(
            transformPoint(dx1, -dy1, cosA, sinA),
            transformPoint(dx2, -dy2, cosA, sinA)
          );
        }
      }

      canvas.addEventListener('pointerdown', function (e) {
        isDrawing = true;
        lastPos = getPos(e);
        canvas.setPointerCapture(e.pointerId);
      });

      canvas.addEventListener('pointermove', function (e) {
        if (!isDrawing) return;
        var pos = getPos(e);
        drawSegment(lastPos.x, lastPos.y, pos.x, pos.y);
        lastPos = pos;
      });

      canvas.addEventListener('pointerup', function () {
        isDrawing = false;
      });

      canvas.addEventListener('pointerleave', function () {
        isDrawing = false;
      });

      document.querySelectorAll('.palette .swatch').forEach(function (swatch) {
        swatch.addEventListener('click', function () {
          currentColor = swatch.dataset.color;
          document.querySelectorAll('.palette .swatch').forEach(function (s) {
            s.classList.remove('active');
          });
          swatch.classList.add('active');
        });
      });

      document.querySelectorAll('.mandala-symmetry .filter-btn').forEach(function (btn) {
        btn.addEventListener('click', function () {
          symmetry = parseInt(btn.dataset.symmetry, 10);
          document.querySelectorAll('.mandala-symmetry .filter-btn').forEach(function (b) {
            b.classList.remove('active');
          });
          btn.classList.add('active');
        });
      });

      document.getElementById('mandala-clear').addEventListener('click', clearCanvas);

      clearCanvas();
    });
  </script>
